name: Bug report
description: Something doesn't work or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the beta! English or Turkish is fine.
        The quickest way to help: in the app open **Settings → Health → Copy diagnostics** and paste it below.
  - type: input
    id: version
    attributes:
      label: Skin Tracker version
      description: Settings → Updates shows it, for example `0.1.0-beta.1`.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Shop tab
        2. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Health → Copy diagnostics, then paste here. It has no Riot ID, item names or other personal data.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop images here.
